<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>addr2gpx — adresses vers GPX</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1a1d21; --muted: #6a7076;
    --accent: #2f6fde; --border: #d8dce1; --ok: #1a7f37; --nok: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1e2126; --text: #e8eaed; --muted: #9aa0a6;
      --accent: #5b8def; --border: #33373d; --ok: #4ec97c; --nok: #e57363;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, sans-serif;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 720px; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  p.sub { color: var(--muted); margin: 0 0 1.5rem; font-size: .9rem; }
  label { display: block; font-weight: 600; margin: 1rem 0 .35rem; font-size: .85rem; }
  textarea {
    width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: .6rem .75rem;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #addresses { min-height: 10rem; }
  #log { min-height: 8rem; color: var(--muted); }
  label.check {
    display: flex; align-items: center; gap: .5rem;
    font-weight: 400; font-size: .9rem; margin-top: .75rem; cursor: pointer;
  }
  label.check input { accent-color: var(--accent); }
  .actions { display: flex; gap: .75rem; margin-top: 1rem; }
  button {
    padding: .55rem 1.2rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font: inherit; font-weight: 600;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #status { margin-left: auto; align-self: center; font-size: .85rem; color: var(--muted); }
  #mapwrap { display: none; margin-top: 1rem; }
  #map {
    height: 380px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel);
  }
  .num-marker {
    background: var(--accent); color: #fff; border: 2px solid #fff;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font: 600 12px/1 system-ui, sans-serif;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
</style>
</head>
<body>
<main>
  <h1>addr2gpx</h1>
  <p class="sub">Géocode une liste d'adresses (API Géoplateforme IGN) et génère un fichier GPX de waypoints. Une adresse par ligne, lignes commençant par <code>#</code> ignorées.</p>

  <label for="addresses">Adresses</label>
  <textarea id="addresses" placeholder="5 avenue Anatole France, Paris&#10;Place Bellecour, Lyon" spellcheck="false"></textarea>

  <label class="check"><input type="checkbox" id="optimize" checked> Optimiser l'ordre du trajet (vélo, trajet ouvert, départ = première adresse)</label>

  <div class="actions">
    <button id="create" class="primary" disabled>Créer le GPX</button>
    <button id="download" disabled>Télécharger le GPX</button>
    <span id="status">Chargement du module WASM…</span>
  </div>

  <div id="mapwrap">
    <label>Aperçu du parcours</label>
    <div id="map"></div>
  </div>

  <label for="log">Journal</label>
  <textarea id="log" readonly spellcheck="false"></textarea>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="wasm_exec.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const createBtn = $("create"), downloadBtn = $("download"), logBox = $("log"), status = $("status");
  let gpxContent = null;

  function log(msg) {
    logBox.value += msg + "\n";
    logBox.scrollTop = logBox.scrollHeight;
  }

  // GPX viewer: numbered markers for each waypoint, polyline only when the
  // document carries an ordered <rte> (i.e. optimization was enabled).
  let map = null, routeLayer = null;
  function showMap(gpxText) {
    if (typeof L === "undefined") return; // Leaflet CDN unreachable — skip viewer
    const doc = new DOMParser().parseFromString(gpxText, "application/xml");
    const rtepts = [...doc.querySelectorAll("rtept")];
    const pts = (rtepts.length ? rtepts : [...doc.querySelectorAll("wpt")]).map((el) => ({
      lat: parseFloat(el.getAttribute("lat")),
      lon: parseFloat(el.getAttribute("lon")),
      name: el.querySelector("name")?.textContent ?? "",
    }));
    if (!pts.length) return;

    $("mapwrap").style.display = "block";
    if (!map) {
      map = L.map("map");
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);
    }
    if (routeLayer) routeLayer.remove();
    routeLayer = L.layerGroup().addTo(map);

    const latlngs = pts.map((p) => [p.lat, p.lon]);
    const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
    if (rtepts.length) {
      L.polyline(latlngs, { color: accent, weight: 3, opacity: 0.8 }).addTo(routeLayer);
    }
    pts.forEach((p, i) => {
      L.marker([p.lat, p.lon], {
        icon: L.divIcon({ className: "num-marker", html: String(i + 1), iconSize: [24, 24] }),
      }).bindPopup(`${i + 1}. ${p.name}`).addTo(routeLayer);
    });

    map.invalidateSize(); // the container was display:none at map creation time
    map.fitBounds(L.latLngBounds(latlngs).pad(0.15));
  }

  // Load the Go WASM module. Fallback to arrayBuffer for servers that
  // don't send the application/wasm MIME type required by instantiateStreaming.
  const go = new Go();
  (async () => {
    try {
      let result;
      try {
        result = await WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject);
      } catch {
        const buf = await (await fetch("main.wasm")).arrayBuffer();
        result = await WebAssembly.instantiate(buf, go.importObject);
      }
      go.run(result.instance); // runs until the Go program exits — do not await
      createBtn.disabled = false;
      status.textContent = "Prêt";
    } catch (err) {
      status.textContent = "Échec du chargement WASM";
      log("NOK  chargement du module : " + err);
    }
  })();

  createBtn.addEventListener("click", async () => {
    const input = $("addresses").value;
    if (!input.trim()) { log("NOK  aucune adresse saisie"); return; }

    logBox.value = "";
    gpxContent = null;
    createBtn.disabled = true;
    downloadBtn.disabled = true;
    status.textContent = "Géocodage en cours…";

    try {
      gpxContent = await createGPX(input, $("optimize").checked, log);
      downloadBtn.disabled = false;
      status.textContent = "GPX prêt";
      log("OK   GPX généré (" + gpxContent.length + " octets)");
      showMap(gpxContent);
    } catch (err) {
      status.textContent = "Échec";
      log("NOK  " + (err.message || err));
    } finally {
      createBtn.disabled = false;
    }
  });

  downloadBtn.addEventListener("click", () => {
    const blob = new Blob([gpxContent], { type: "application/gpx+xml" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "adresses.gpx";
    a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
